name: Validate eggs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate egg JSON
        run: python3 -m json.tool egg-ravalink.json > /dev/null
      - name: Validate native Docker image contract
        run: |
          grep -q 'ghcr.io/ravalink-project/ravalink:latest' egg-ravalink.json
          grep -q '"startup": "ravalink"' egg-ravalink.json
          grep -q 'already included in the selected runtime image' egg-ravalink.json
          python3 -m json.tool egg-ravalink-pelican.json > /dev/null
          grep -q '"version": "PLCN_v3"' egg-ravalink-pelican.json
          grep -q '"startup_commands"' egg-ravalink-pelican.json
          grep -q '"rules": \[' egg-ravalink-pelican.json
